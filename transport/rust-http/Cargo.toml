[package]
name = "leant_rust_http"
version = "0.1.0"
edition = "2021"

[lib]
name = "leant_rust_http"
crate-type = ["staticlib"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "sync", "time"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
getrandom = "0.2"
