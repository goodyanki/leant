name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leant
          POSTGRES_PASSWORD: leant
          POSTGRES_DB: leant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite development headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install elan and Lean toolchain
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check for sorry / partial / unsafe in core library
        run: |
          if grep -rnE '\b(sorry|partial|unsafe)\b' Leant.lean Leant/; then
            echo "ERROR: forbidden sorry/partial/unsafe found in core library!"
            exit 1
          fi

      - name: Build Leant, examples, and benchmark binary
        run: |
          lake build
          lake build hello
          lake build todo
          lake build saas
          lake build bench_leant

      - name: Run unit, formal proof, negative-compile, SQLite, and PostgreSQL integration tests
        env:
          LEANT_TEST_PG_URL: postgres://leant:leant@127.0.0.1:5432/leant_test
          LEANT_REQUIRE_PG: "1"
        run: lake test

      - name: Compare ORM inserts with SQLAlchemy on SQLite and PostgreSQL
        env:
          LEANT_TEST_PG_URL: postgres://leant:leant@127.0.0.1:5432/leant_test
        run: |
          python3 -m venv "$RUNNER_TEMP/orm-tests"
          "$RUNNER_TEMP/orm-tests/bin/pip" install -r tests/orm/requirements.txt
          lake build orm_insert_probe
          "$RUNNER_TEMP/orm-tests/bin/python" -m pytest -q tests/orm

      - name: Smoke test bench_leant endpoints
        run: |
          ADDR=127.0.0.1:18082 ./.lake/build/bin/bench_leant &
          PID=$!
          trap "kill -TERM $PID 2>/dev/null || true; wait $PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18082/plaintext > /dev/null 2>&1; then break; fi
            sleep 0.1
          done
          test "$(curl -sS http://127.0.0.1:18082/plaintext)" = "Hello, World!"
          test "$(curl -sS http://127.0.0.1:18082/json)" = '{"message":"Hello, World!"}'
